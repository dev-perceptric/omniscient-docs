# Uptime check for every app, site and database API, every 5 minutes.
# When something stays down for three tries in a row, it opens an issue labeled "uptime" (GitHub emails you),
# adds a comment when the list changes, and closes the issue once everything is back up.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check every address
        id: check
        shell: bash
        run: |
          # name|url|rule  (rule "ok" needs a 2xx or 3xx; "up" takes any answer below 500, for APIs that ask for a key)
          targets=(
            "Arrowsterr app|https://app.arrowsterr.com/signup|ok"
            "Omniscient app|https://app.tryomniscient.com/signup|ok"
            "Capybaroar app|https://app.capybaroar.com/signup|ok"
            "Claritia app|https://app.tryclaritia.com/signup|ok"
            "Arrowsterr database|https://db.arrowsterr.com/auth/v1/health|up"
            "Omniscient database|https://db.tryomniscient.com/auth/v1/health|up"
            "Capybaroar database|https://db.capybaroar.com/auth/v1/health|up"
            "Claritia database|https://db.tryclaritia.com/auth/v1/health|up"
            "Arrowsterr site|https://arrowsterr.com|ok"
            "Omniscient site|https://tryomniscient.com|ok"
            "Capybaroar site|https://capybaroar.com|ok"
            "Claritia site|https://tryclaritia.com|ok"
            "Arrowsterr docs|https://docs.arrowsterr.com|ok"
            "Omniscient docs|https://docs.tryomniscient.com|ok"
            "Capybaroar docs|https://docs.capybaroar.com|ok"
            "Claritia docs|https://docs.tryclaritia.com|ok"
          )
          down=""
          for t in "${targets[@]}"; do
            IFS='|' read -r name url rule <<< "$t"
            good=0
            for try in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -L "$url" || true)
              if [ "$rule" = ok ] && [[ "$code" =~ ^[23] ]]; then good=1; break; fi
              if [ "$rule" = up ] && [ "$code" != 000 ] && [ "$code" -lt 500 ]; then good=1; break; fi
              [ "$try" -lt 3 ] && sleep 20
            done
            if [ "$good" = 1 ]; then echo "up   $name ($code)"; else echo "DOWN $name ($code)"; down="${down}- **${name}**: ${url} answered ${code} (000 means no answer)\n"; fi
          done
          {
            echo "down<<EOF"
            printf "%b" "$down"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the alert
        uses: actions/github-script@v7
        env:
          DOWN: ${{ steps.check.outputs.down }}
        with:
          script: |
            const down = (process.env.DOWN || "").trim();
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "uptime", per_page: 1 });
            const issue = open.data[0];
            const now = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            if (down) {
              const body = `Down as of ${now}:\n\n${down}`;
              if (!issue) {
                await github.rest.issues.create({ owner, repo, title: "Down: " + down.split("\n").map((l) => l.match(/\*\*(.+?)\*\*/)?.[1]).filter(Boolean).join(", "), body, labels: ["uptime"] });
              } else if (!issue.body.includes(down)) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Changed at ${now}:\n\n${down}` });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Everything is back up as of ${now}.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
            }

      # GitHub turns off scheduled workflows after 60 days without commits; this keeps this one on.
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            await github.rest.actions.enableWorkflow({ owner, repo, workflow_id: run.data.workflow_id });
